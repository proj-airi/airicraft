def prepareMinecraftRunOptions = tasks.register("prepareMinecraftRunOptions") {
	group = "airicraft run"
	description = "Disables Minecraft's first-run accessibility onboarding for unattended launches."
	outputs.upToDateWhen { false }
	doLast {
		def runDir = evaluatorRunDir.isPresent()
			? file(evaluatorRunDir.get())
			: layout.projectDirectory.dir("run").asFile
		def optionsFile = new File(runDir, "options.txt")
		def existingLines = optionsFile.exists() ? optionsFile.readLines("UTF-8") : []
		def foundOnboardingOption = false
		def updatedLines = existingLines.collect { line ->
			if (line.startsWith("onboardAccessibility:")) {
				foundOnboardingOption = true
				return "onboardAccessibility:false"
			}
			return line
		}
		if (!foundOnboardingOption) {
			updatedLines.add("onboardAccessibility:false")
		}
		def updatedText = updatedLines.join("\n") + "\n"
		def existingText = optionsFile.exists() ? optionsFile.getText("UTF-8") : null
		if (existingText != updatedText) {
			optionsFile.parentFile.mkdirs()
			optionsFile.setText(updatedText, "UTF-8")
		}
	}
}

def syncHotswapMainClasses = tasks.register("syncHotswapMainClasses") {
	group = "airicraft debug"
	description = "Copies changed remapped Airicraft classes into the production HotSwap watch directory."
	dependsOn tasks.named("remapJar")
	inputs.file(tasks.named("remapJar").flatMap { it.archiveFile })
	outputs.dir(hotswapProductionClassesDir)

	doLast {
		def outputDir = hotswapProductionClassesDir.get().asFile
		Files.createDirectories(outputDir.toPath())
		def expectedPaths = new HashSet<String>()
		def remappedJar = tasks.named("remapJar").get().archiveFile.get().asFile
		new JarFile(remappedJar).withCloseable { jar ->
			jar.entries().each { entry ->
				if (entry.directory || !entry.name.startsWith("ai/moeru/airicraft/") || !entry.name.endsWith(".class")) {
					return
				}
				expectedPaths.add(entry.name)
				def target = new File(outputDir, entry.name)
				byte[] updatedBytes
				jar.getInputStream(entry).withCloseable { input ->
					updatedBytes = input.readAllBytes()
				}
				def unchanged = target.isFile() && Arrays.equals(Files.readAllBytes(target.toPath()), updatedBytes)
				if (!unchanged) {
					Files.createDirectories(target.parentFile.toPath())
					def temporary = new File(target.parentFile, ".${target.name}.${UUID.randomUUID()}.tmp")
					try {
						Files.write(temporary.toPath(), updatedBytes)
						atomicMove(temporary, target)
					}
					finally {
						if (temporary.exists()) {
							Files.delete(temporary.toPath())
						}
					}
				}
			}
		}
		def staleFiles = []
		Files.walk(outputDir.toPath()).withCloseable { paths ->
			paths.filter { Files.isRegularFile(it) && it.fileName.toString().endsWith(".class") }.forEach { path ->
				def relative = outputDir.toPath().relativize(path).toString().replace(File.separatorChar, '/' as char)
				if (!expectedPaths.contains(relative)) {
					staleFiles.add(path)
				}
			}
		}
		staleFiles.each { Files.deleteIfExists(it) }
	}
}

def hotswapConfigFile = { String taskPath ->
	def fileName = taskPath.replaceAll(/^:/, "").replace(':', '-') + ".properties"
	return layout.buildDirectory.file("hotswap/config/${fileName}")
}
def writeHotswapConfig = { Provider<RegularFile> configFile ->
	def outputFile = configFile.get().asFile
	Files.createDirectories(outputFile.parentFile.toPath())
	outputFile.setText("autoHotswap=false\nLOGGER=info\n", "UTF-8")
}
def hotswapDevConfig = hotswapConfigFile(":runClient")

