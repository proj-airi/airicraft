def hotswapJvmArgs = { Provider<RegularFile> propertiesFile ->
	def agentOptions = [
		"autoHotswap=false",
		"propertiesFilePath=${propertiesFile.get().asFile.absolutePath}"
	]
	agentOptions.addAll(hotswapDisabledPlugins.collect { "disablePlugin=${it}" })

	return [
        '-XX:+IgnoreUnrecognizedVMOptions',
		"-XX:+AllowEnhancedClassRedefinition",
		"-XX:HotswapAgent=external",
		"-Xlog:redefine+class*=info",
		"-javaagent:${hotswapAgentPath}=${agentOptions.join(',')}",
		"-javaagent:${mixinAgentPath}"
	]
}

