		}

		tasks.register("syncCompatLibraries") {
			group = "airicraft compatibility"
			description = "Copies Airicraft runtime libraries into the shared compatibility cache."
			dependsOn journeyMapCompatProject.tasks.named("syncJourneyMapCompatLibraries")
		}

		tasks.register("runClientCompat") {
			group = "airicraft compatibility"
			description = "Runs a debug production-style Fabric client with all compatibility smoke mods."
			dependsOn journeyMapCompatProject.tasks.named("runClientJourneyMapCompat")
		}

		// Optional mod jars use intermediary mappings, so normal launches must use
		// the production client too. Keep Loom's dev launch for includeCompat=false.
		tasks.named("runClient").configure {
			enabled = false
			setDependsOn([tasks.named("runClientCompat")])
		}
	}
}
