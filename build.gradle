	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}
	include("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") { transitive = false }
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modImplementation files("libs/baritone-unoptimized-fabric-1.15.0.jar")
	modImplementation files("libs/nether-pathfinder-1.4.1.jar")
	implementation "ai.moeru:action-plan-advisor:0.1.0"
	include "ai.moeru:action-plan-advisor:0.1.0"
	bundledLibraries "org.yaml:snakeyaml:2.4"
	// Use concrete JARs: the js-community aggregate adds POM files that Fabric cannot load.
	// Keep language/provider descriptors in separate nested jars (include is non-transitive).
	[
		"org.graalvm.polyglot:polyglot", "org.graalvm.js:js-language", "org.graalvm.regex:regex",
		"org.graalvm.truffle:truffle-api", "org.graalvm.truffle:truffle-runtime", "org.graalvm.truffle:truffle-compiler",
		"org.graalvm.sdk:collections", "org.graalvm.sdk:nativeimage", "org.graalvm.sdk:word", "org.graalvm.sdk:jniutils",
		"org.graalvm.shadowed:icu4j", "org.graalvm.shadowed:xz"
	].each { coordinate ->
		implementation("${coordinate}:25.0.4") { transitive = false }
		include("${coordinate}:25.0.4") { transitive = false }
	}

	bundledLibraries "io.opentelemetry:opentelemetry-api:1.60.1"
	bundledLibraries "io.opentelemetry:opentelemetry-sdk:1.60.1"
	bundledLibraries "io.opentelemetry:opentelemetry-exporter-otlp:1.60.1"
	// Loom include is non-transitive: resolve the complete library runtime first.
	configurations.bundledLibraries.resolvedConfiguration.resolvedArtifacts.each { artifact ->
		include(artifact.moduleVersion.id.toString()) { transitive = false }
	}

	// Source: https://mvnrepository.com/artifact/org.hotswapagent/hotswap-agent
	runtimeOnly('org.hotswapagent:hotswap-agent:2.0.3') { transitive = false }

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

