	group = "airicraft debug"
	description = "Writes the runClient HotswapAgent settings."
	outputs.file(hotswapDevConfig)
	outputs.upToDateWhen { false }
	doLast {
		writeHotswapConfig(hotswapDevConfig)
	}
}

def productionHotswapConfigs = []
def prepareHotswapProductionConfigs = tasks.register("prepareHotswapProductionConfigs") {
	group = "airicraft debug"
	description = "Writes task-specific HotswapAgent settings for production clients."
	dependsOn syncHotswapMainClasses
	outputs.files(providers.provider { productionHotswapConfigs.collect { it.get().asFile } })
	outputs.upToDateWhen { false }
	doLast {
		productionHotswapConfigs.each { writeHotswapConfig(it) }
	}
}

tasks.register("hotswapMain", JavaExec) {
	group = "airicraft debug"
	description = "Compiles and reloads main Airicraft classes in existing clients."
	dependsOn tasks.named("classes")
	dependsOn syncHotswapMainClasses
	dependsOn tasks.named(hotswapToolSourceSet.classesTaskName)
	classpath = hotswapToolSourceSet.runtimeClasspath
	mainClass.set("ai.moeru.airicraft.hotswap.HotswapMainUploader")

	doFirst {
		def devClassRoots = (sourceSets.main.output.classesDirs.files + sourceSets.client.output.classesDirs.files)
			.findAll { it.isDirectory() }
			.sort { left, right -> left.absolutePath <=> right.absolutePath }
		def uploaderArgs = [
			"--state", hotswapStateFile.get().asFile.absolutePath,
			"--production-root", hotswapProductionClassesDir.get().asFile.absolutePath
		]
		uploaderArgs.addAll([
			findProject(":compat:journeymap") != null ? "--production-port" : "--dev-port",
			runClientJdwpPort.get()
		])
		devClassRoots.each {
			uploaderArgs.add("--dev-root")
			uploaderArgs.add(it.absolutePath)
		}
		[5006, 5007, 5008].findAll { it.toString() != runClientJdwpPort.get() }.each {
			uploaderArgs.add("--production-port")
			uploaderArgs.add(it.toString())
		}
		setArgs(uploaderArgs)
	}
}

tasks.named("runClient").configure {
	dependsOn prepareMinecraftRunOptions
	dependsOn prepareHotswapDevConfig
	jvmArgs(
		"-agentlib:jdwp=transport=dt_socket,server=y,suspend=${runClientJdwpSuspend.get()},address=127.0.0.1:${runClientJdwpPort.get()}",
		*hotswapJvmArgs(hotswapDevConfig)
	)
	systemProperty("airicraft.codexDriver", codexDriverEnabled.get())
	systemProperty("airicraft.automaticPlaytest", automaticPlaytestEnabled.get())
	if (automaticPlaytestId.isPresent()) systemProperty("airicraft.automaticPlaytestId", automaticPlaytestId.get())
	systemProperty("airicraft.automaticPlaytestDir", automaticPlaytestDir.get())
	if (automaticPlaytestMode.isPresent()) systemProperty("airicraft.automaticPlaytestMode", automaticPlaytestMode.get())
	systemProperty("airicraft.hostedPlaytestAutoReset", hostedPlaytestAutoReset.get())
	if (lanPort.isPresent()) systemProperty("airicraft.lanPort", lanPort.get())
}

allprojects {
	apply plugin: 'java'

	if (project != rootProject) {
		// Gradle's unqualified `runClient` selects matching subproject tasks too.
		// Addons cannot run alone; only the root profile should launch a client.
		tasks.matching { it.name == "runClient" }.configureEach {
			enabled = false
			setDependsOn([])
		}
	}

	tasks.withType(net.fabricmc.loom.task.prod.ClientProductionRunTask).configureEach {
		// Loom projects share the asset cache. Unqualified launch commands may
		// select several download tasks, all of which must finish before launch.
		mustRunAfter(rootProject.allprojects.collect { owner ->
			owner.tasks.matching { it.name == "downloadAssets" }
		})
		def taskHotswapConfig = hotswapConfigFile(path)
		productionHotswapConfigs.add(taskHotswapConfig)
		dependsOn rootProject.tasks.named("prepareHotswapProductionConfigs")
		jvmArgs.addAll(hotswapJvmArgs(taskHotswapConfig))
		jvmArgs.add("-Dairicraft.codexDriver=${codexDriverEnabled.get()}")
		jvmArgs.add("-Dairicraft.automaticPlaytest=${automaticPlaytestEnabled.get()}")
		if (automaticPlaytestId.isPresent()) jvmArgs.add("-Dairicraft.automaticPlaytestId=${automaticPlaytestId.get()}")
		jvmArgs.add("-Dairicraft.automaticPlaytestDir=${automaticPlaytestDir.get()}")
		if (automaticPlaytestMode.isPresent()) jvmArgs.add("-Dairicraft.automaticPlaytestMode=${automaticPlaytestMode.get()}")
		jvmArgs.add("-Dairicraft.hostedPlaytestAutoReset=${hostedPlaytestAutoReset.get()}")
		if (lanPort.isPresent()) jvmArgs.add("-Dairicraft.lanPort=${lanPort.get()}")
		programArgs.addAll("--username", devPlayerName.get())
	}

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21

        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
            vendor = JvmVendorSpec.JETBRAINS
        }
    }

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 21
	}
}

def arthasJavaExecutable = {
	new File(System.getProperty("java.home"), "bin/java").absolutePath
}

def arthasProcessSelectorArgs = {
	def pid = arthasPid.get().trim()
	if (!pid.isEmpty()) {
		return [pid]
	}
	return ["--select", arthasSelect.get()]
}

def arthasExtraArgList = {
	def extraArgs = arthasExtraArgs.get().trim()
	if (extraArgs.isEmpty()) {
		return []
	}
	return extraArgs.split(/\s+/).findAll { !it.isEmpty() }
}

def arthasBootArgs = { boolean attachOnly ->
	def args = [
		"-jar", arthasBootJar.get().asFile.absolutePath,
		"--target-ip", arthasTargetIp.get(),
		"--http-port", arthasHttpPort.get(),
		"--telnet-port", arthasTelnetPort.get()
	]

	if (attachOnly) {
		args.add("--attach-only")
	}

	def disabledCommands = arthasDisabledCommands.get().trim()
	if (!disabledCommands.isEmpty()) {
		args.add("--disabled-commands")
		args.add(disabledCommands)
	}

	args.addAll(arthasExtraArgList())
	args.addAll(arthasProcessSelectorArgs())
	return args
}

tasks.register("downloadArthasBoot") {
	group = "airicraft debug"
	description = "Downloads the pinned Arthas boot jar for dev-client diagnostics."
	outputs.file(arthasBootJar)

	doLast {
		def outputFile = arthasBootJar.get().asFile
		if (outputFile.exists() && outputFile.length() > 0) {
			logger.lifecycle("Arthas boot jar already exists: ${outputFile}")
			return
		}

		outputFile.parentFile.mkdirs()
		logger.lifecycle("Downloading Arthas boot jar from ${arthasBootUrl.get()} to ${outputFile}")
		ant.get(src: arthasBootUrl.get(), dest: outputFile)
	}
}

tasks.register("arthasAttach", Exec) {
	group = "airicraft debug"
	description = "Attaches Arthas to the running Minecraft dev client without opening a shell."
	dependsOn tasks.named("downloadArthasBoot")
	standardInput = System.in

	doFirst {
		commandLine([arthasJavaExecutable()] + arthasBootArgs(true))
	}
}

tasks.register("arthasShell", Exec) {
	group = "airicraft debug"
	description = "Attaches Arthas to the running Minecraft dev client and opens the Arthas shell."
	dependsOn tasks.named("downloadArthasBoot")
	standardInput = System.in

	doFirst {
		commandLine([arthasJavaExecutable()] + arthasBootArgs(false))
	}
}

