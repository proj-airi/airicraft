plugins {
	alias(libs.plugins.fabric.loom.remap)
}

version = rootProject.version
group = project.maven_group

base {
	archivesName = "airicraft-journeymap-compat"
}

repositories {
	maven {
		name = "JourneyMap"
		url = uri("https://maven.blamejared.com")
		content {
			includeGroup "info.journeymap"
		}
	}
	maven {
		name = "Modrinth"
		url = uri("https://api.modrinth.com/maven")
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		name = "Shedaniel"
		url = uri("https://maven.shedaniel.me/")
		content {
			includeGroup "me.shedaniel"
			includeGroup "me.shedaniel.cloth"
		}
	}
	maven {
		name = "Architectury"
		url = uri("https://maven.architectury.dev")
		content {
			includeGroup "dev.architectury"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"airicraft-journeymap-compat" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

configurations {
	journeyMapCompatMods {
		canBeConsumed = false
		canBeResolved = true
		transitive = false
	}

	journeyMapCompatLibraries {
		canBeConsumed = false
		canBeResolved = true
		transitive = true
	}
}

def reiCompatProject = rootProject.findProject(":compat:rei")

dependencies {
	minecraft libs.minecraft
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${libs.versions.minecraft.get()}:${libs.versions.parchment.get()}@zip")
	}
	modImplementation libs.fabric.loader
	modImplementation libs.fabric.api
	clientCompileOnly rootProject.sourceSets.main.output
	clientCompileOnly rootProject.sourceSets.client.output
	modCompileOnlyApi libs.journeymap.api
	modRuntimeOnly libs.journeymap.mod

	journeyMapCompatMods libs.fabric.api
	journeyMapCompatMods libs.journeymap.mod
	if (reiCompatProject != null) {
		journeyMapCompatMods libs.bundles.rei.runtime
	}
	journeyMapCompatLibraries libs.bundles.runtime.libraries

	testImplementation platform(libs.junit.bom)
	testImplementation libs.junit.jupiter
	// Tests need the same named API classes as client code, not the intermediary artifact.
	testImplementation files(sourceSets.client.compileClasspath)
	testImplementation rootProject.sourceSets.main.output
	testImplementation rootProject.sourceSets.client.output
	testRuntimeOnly libs.junit.platform.launcher
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.named("test") {
	useJUnitPlatform()
}

def sharedDevRunDir = rootProject.layout.projectDirectory.dir("run")
def journeyMapCompatCacheDir = rootProject.layout.projectDirectory.dir(".airicraft-compat/integration")
def journeyMapCompatModsDir = journeyMapCompatCacheDir.dir("mods")
def journeyMapCompatLibrariesDir = journeyMapCompatCacheDir.dir("libraries")

tasks.register("syncJourneyMapCompatMods", Sync) {
	group = "airicraft compatibility"
	description = "Copies Airicraft, Airicraft JourneyMap compat, JourneyMap, REI when enabled, and local runtime mods into .airicraft-compat/integration/mods."
	dependsOn rootProject.tasks.named("remapJar")
	dependsOn tasks.named("remapJar")
	if (reiCompatProject != null) {
		dependsOn reiCompatProject.tasks.named("remapJar")
	}

	into(journeyMapCompatModsDir)
	from(rootProject.tasks.named("remapJar").flatMap { it.archiveFile })
	from(tasks.named("remapJar").flatMap { it.archiveFile })
	from(configurations.journeyMapCompatMods)
	if (reiCompatProject != null) {
		from(reiCompatProject.tasks.named("remapJar").flatMap { it.archiveFile })
	}
}

tasks.register("syncJourneyMapCompatLibraries", Sync) {
	group = "airicraft compatibility"
	description = "Copies Airicraft non-mod runtime libraries into .airicraft-compat/integration/libraries."
	from(configurations.journeyMapCompatLibraries)
	into(journeyMapCompatLibrariesDir)
}

tasks.register("runClientJourneyMapCompat", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	group = "airicraft compatibility"
	description = "Runs a debug production-style Fabric client with Airicraft JourneyMap compat and REI when enabled."
	dependsOn rootProject.tasks.named("prepareMinecraftRunOptions")
	dependsOn tasks.named("syncJourneyMapCompatMods")
	dependsOn tasks.named("syncJourneyMapCompatLibraries")
	outputs.upToDateWhen { false }

	mods.from(rootProject.tasks.named("remapJar").flatMap { it.archiveFile })
	mods.from(tasks.named("remapJar").flatMap { it.archiveFile })
	mods.from(configurations.journeyMapCompatMods)
	if (reiCompatProject != null) {
		mods.from(reiCompatProject.tasks.named("remapJar").flatMap { it.archiveFile })
	}
	classpath.from(configurations.journeyMapCompatLibraries)
	runDir = sharedDevRunDir.asFile
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(21)
	}
	def normalLaunch = gradle.startParameter.taskNames.any { it == "runClient" || it == ":runClient" }
	def debugPort = providers.gradleProperty("airicraft.jdwp.port").orElse(normalLaunch ? "5005" : "5007").get()
	def debugSuspend = providers.gradleProperty("airicraft.jdwp.suspend").orElse("n").get()
	jvmArgs.add("-agentlib:jdwp=transport=dt_socket,server=y,suspend=${debugSuspend},address=127.0.0.1:${debugPort}")
}
