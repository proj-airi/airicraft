plugins {
	alias(libs.plugins.fabric.loom.remap)
}

version = rootProject.version
group = project.maven_group

base {
	archivesName = "airicraft-rei-compat"
}

repositories {
	maven {
		name = 'Shedaniel'
		url = uri('https://maven.shedaniel.me/')
		content {
			includeGroup 'me.shedaniel'
			includeGroup 'me.shedaniel.cloth'
		}
	}
	maven {
		name = 'Architectury'
		url = uri('https://maven.architectury.dev')
		content {
			includeGroup 'dev.architectury'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"airicraft-rei-compat" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

configurations {
	reiCompatMods {
		canBeConsumed = false
		canBeResolved = true
		transitive = false
	}

	reiCompatLibraries {
		canBeConsumed = false
		canBeResolved = true
		transitive = true
	}
}

dependencies {
	minecraft libs.minecraft
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${libs.versions.minecraft.get()}:${libs.versions.parchment.get()}@zip")
	}
	modImplementation libs.fabric.loader
	modImplementation libs.fabric.api
	clientCompileOnly rootProject.sourceSets.main.output
	clientCompileOnly rootProject.sourceSets.client.output
	modCompileOnly libs.rei.api
	modRuntimeOnly libs.bundles.rei.runtime

	reiCompatMods libs.fabric.api
	reiCompatMods libs.bundles.rei.runtime
	reiCompatLibraries libs.bundles.runtime.libraries

	testImplementation platform(libs.junit.bom)
	testImplementation libs.junit.jupiter
	testRuntimeOnly libs.junit.platform.launcher
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('test') {
	useJUnitPlatform()
}

def sharedDevRunDir = rootProject.layout.projectDirectory.dir("run")
def reiCompatCacheDir = rootProject.layout.projectDirectory.dir(".airicraft-compat/rei")
def reiCompatModsDir = reiCompatCacheDir.dir("mods")
def reiCompatLibrariesDir = reiCompatCacheDir.dir("libraries")

tasks.register("syncReiCompatMods", Sync) {
	group = "airicraft compatibility"
	description = "Copies Airicraft, Airicraft REI compat, REI, and local runtime mods into .airicraft-compat/rei/mods."
	dependsOn rootProject.tasks.named("remapJar")
	dependsOn tasks.named("remapJar")

	into(reiCompatModsDir)
	from(rootProject.tasks.named("remapJar").flatMap { it.archiveFile })
	from(tasks.named("remapJar").flatMap { it.archiveFile })
	from(configurations.reiCompatMods)
}

tasks.register("syncReiCompatLibraries", Sync) {
	group = "airicraft compatibility"
	description = "Copies Airicraft non-mod runtime libraries into .airicraft-compat/rei/libraries."
	from(configurations.reiCompatLibraries)
	into(reiCompatLibrariesDir)
}

tasks.register("runClientReiCompat", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	group = "airicraft compatibility"
	description = "Runs a debug production-style Fabric client with Airicraft REI compat."
	dependsOn rootProject.tasks.named("prepareMinecraftRunOptions")
	dependsOn tasks.named("syncReiCompatMods")
	dependsOn tasks.named("syncReiCompatLibraries")
	outputs.upToDateWhen { false }

	mods.from(rootProject.tasks.named("remapJar").flatMap { it.archiveFile })
	mods.from(tasks.named("remapJar").flatMap { it.archiveFile })
	mods.from(configurations.reiCompatMods)
	classpath.from(configurations.reiCompatLibraries)
	runDir = sharedDevRunDir.asFile
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(21)
	}
	jvmArgs.add("-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5006")
}
