buildscript {
	repositories { mavenCentral() }
	dependencies { classpath libs.snakeyaml }
}

plugins {
	alias(libs.plugins.fabric.loom.remap)
}

version = rootProject.version
group = project.maven_group

base {
	archivesName = "airicraft-evaluator"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"airicraft-evaluator" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

configurations {
	evaluatorRuntimeMods {
		canBeConsumed = false
		canBeResolved = true
		transitive = false
	}

	evaluatorRuntimeLibraries {
		canBeConsumed = false
		canBeResolved = true
		transitive = true
	}

	testRuntimeOnly.extendsFrom(evaluatorRuntimeLibraries)
}

dependencies {
	minecraft libs.minecraft
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${libs.versions.minecraft.get()}:${libs.versions.parchment.get()}@zip")
	}
	modImplementation libs.fabric.loader
	modImplementation libs.fabric.api
	clientCompileOnly rootProject.sourceSets.main.output
	clientCompileOnly rootProject.sourceSets.client.output
	implementation libs.snakeyaml

	evaluatorRuntimeMods libs.fabric.api
	evaluatorRuntimeLibraries libs.bundles.runtime.libraries

	testImplementation platform(libs.junit.bom)
	testImplementation libs.junit.jupiter
	testImplementation rootProject.sourceSets.main.output
	testImplementation rootProject.sourceSets.client.output
	// Runtime fixtures instantiate the root client, including its Baritone tool schemas.
	testRuntimeOnly files(rootProject.sourceSets.client.runtimeClasspath)
	testRuntimeOnly libs.junit.platform.launcher
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.named("test") {
	useJUnitPlatform()
}

def sharedDevRunDir = rootProject.layout.projectDirectory.dir("run")
def evaluatorRunDir = providers.gradleProperty("airicraft.evaluator.runDir")
	.orElse(sharedDevRunDir.asFile.absolutePath)
def evaluatorJdwpEnabled = providers.gradleProperty("airicraft.evaluator.jdwp.enabled")
	.orElse("true")
def evaluatorRuntimePrepared = providers.gradleProperty("airicraft.evaluator.runtimePrepared")
	.orElse("false")
def evaluatorRecorderJar = providers.gradleProperty("airicraft.evaluator.recorderJar")
def evaluatorScenariosDir = rootProject.layout.projectDirectory.dir("scenarios")
def scenarioManifest = providers.gradleProperty("airicraft.evaluator.scenarioManifest")
	.orElse(providers.environmentVariable("AIRICRAFT_EVALUATOR_SCENARIO_MANIFEST"))
def requiredMods = []
if (scenarioManifest.isPresent()) {
	def manifest = rootProject.file(scenarioManifest.get())
	if (!manifest.isFile()) {
		throw new GradleException("Scenario manifest does not exist: ${manifest}")
	}
	def yaml = new org.yaml.snakeyaml.Yaml(new org.yaml.snakeyaml.constructor.SafeConstructor(new org.yaml.snakeyaml.LoaderOptions()))
	def scenario = manifest.withReader("UTF-8") { yaml.load(it) }
	if (!(scenario instanceof Map)) {
		throw new GradleException("Scenario manifest must be a mapping: ${manifest}")
	}
	requiredMods = scenario.containsKey("requiredMods") ? scenario.requiredMods : []
	if (!(requiredMods instanceof List) || requiredMods.any { !(it instanceof String) || !(it in ["journeymap", "roughlyenoughitems"]) }) {
		throw new GradleException("requiredMods must be a list of supported mod IDs: journeymap, roughlyenoughitems")
	}
	requiredMods = requiredMods.unique()
}

// Interactive automatic playtests retain every integration regardless of the batch manifest.
if (providers.gradleProperty("airicraft.automaticPlaytest").orElse("false").get().toBoolean()) {
	requiredMods = ["journeymap", "roughlyenoughitems"]
}

if (evaluatorRuntimePrepared.get().toBoolean()) {
	tasks.named("remapJar") {
		onlyIf { false }
	}
}

def configureEvaluatorProcess = { task ->
	task.runDir = file(evaluatorRunDir.get())
	task.jvmArgs.add("-Dairicraft.scenariosDir=${evaluatorScenariosDir.asFile.absolutePath}")
	if (evaluatorJdwpEnabled.get().toBoolean()) {
		task.jvmArgs.add("-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5008")
	}
}

def configureEvaluatorRecordingProfile = { task ->
	if (evaluatorRecorderJar.isPresent()) {
		def profile = rootProject.file(evaluatorRecorderJar.get())
		if (!profile.isFile()) {
			throw new GradleException("Recording profile does not exist: ${profile}")
		}
		task.mods.from(profile)
	}
}

tasks.register("runClientEvaluator", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	group = "airicraft evaluation"
	description = "Runs a production-style Fabric client with Airicraft and the evaluator addon."
	dependsOn rootProject.tasks.named("prepareMinecraftRunOptions")
	dependsOn rootProject.tasks.named("remapJar")
	dependsOn tasks.named("remapJar")
	outputs.upToDateWhen { false }

	mods.from(rootProject.tasks.named("remapJar").flatMap { it.archiveFile })
	mods.from(tasks.named("remapJar").flatMap { it.archiveFile })
	mods.from(configurations.evaluatorRuntimeMods)
	mods.from(rootProject.layout.projectDirectory.files(
		"libs/baritone-unoptimized-fabric-1.15.0.jar",
		"libs/nether-pathfinder-1.4.1.jar"
	))
	requiredMods.each { modId ->
		def compatName = modId == "journeymap" ? "journeymap" : "rei"
		def compatProject = rootProject.findProject(":compat:${compatName}")
		if (compatProject == null) {
			throw new GradleException("Required mod ${modId} is disabled; enable airicraft.includeCompat")
		}
		mods.from(compatProject.tasks.named("remapJar").flatMap { it.archiveFile })
		// JourneyMap's smoke configuration also contains REI; select only JourneyMap.
		if (modId == "journeymap") {
			mods.from(compatProject.configurations.journeyMapCompatMods.filter { it.name.startsWith("journeymap-") })
		}
		else {
			mods.from(compatProject.configurations.reiCompatMods)
		}
	}
	configureEvaluatorRecordingProfile(delegate)
	classpath.from(configurations.evaluatorRuntimeLibraries)
	configureEvaluatorProcess(delegate)
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// Retained as a command alias; scenario manifests own the batch mod set.
tasks.register("runClientCompatEvaluator") {
	group = "airicraft evaluation"
	description = "Runs the evaluator with scenario mods, or all integrations for automatic playtests."
	dependsOn tasks.named("runClientEvaluator")
}
