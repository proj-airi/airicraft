# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.8
yarn_mappings=1.21.8+build.1
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=ai.moeru.airicraft
archives_base_name=airicraft

# Development client
airicraft.devPlayerName=AiricraftTest

# Arthas dev diagnostics
airicraft.arthas.version=4.1.8
airicraft.arthas.bootUrl=https://arthas.aliyun.com/arthas-boot.jar
# Blank selects the default launch profile's main class.
airicraft.arthas.select=
airicraft.arthas.pid=
airicraft.arthas.httpPort=8563
airicraft.arthas.telnetPort=3658
airicraft.arthas.targetIp=127.0.0.1
airicraft.arthas.disabledCommands=
airicraft.arthas.args=

# Dependencies
fabric_api_version=0.136.1+1.21.8
rei_version=20.0.811
architectury_version=17.0.6
cloth_config_version=19.0.147
journeymap_api_version=2.0.0-1.21.7-SNAPSHOT
journeymap_mod_version=1.21.8-6.0.0-beta.52+fabric
