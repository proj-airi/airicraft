# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Mod Properties
# axion-release derives the build version from v-prefixed git tags; mod_version
# only seeds repositories without any matching tag and is the fallback when SCM
# resolution fails.
mod_version=1.0.0
maven_group=ai.moeru.airicraft
archives_base_name=airicraft

# Development client
airicraft.devPlayerName=AiricraftTest

# Arthas dev diagnostics
airicraft.arthas.version=4.1.8
airicraft.arthas.bootUrl=https://arthas.aliyun.com/arthas-boot.jar
# Blank selects the default launch profile's main class.
airicraft.arthas.select=
airicraft.arthas.pid=
airicraft.arthas.httpPort=8563
airicraft.arthas.telnetPort=3658
airicraft.arthas.targetIp=127.0.0.1
airicraft.arthas.disabledCommands=
airicraft.arthas.args=
