# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: 'jetbrains'
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      # The root suite has wall-clock planning guards that time out when it runs in parallel
      # with other projects' compile and test tasks, so it runs alone in the next step.
      - name: build
        run: ./gradlew build -x :test
      - name: run tests
        run: ./gradlew :test :wrapper:test
      # Separate step: running it alongside :test starves the root suite's wall-clock planning guards.
      - name: build and test evaluator addon
        run: ./gradlew :addons:evaluator:build -Pairicraft.includeEvaluator=true
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
