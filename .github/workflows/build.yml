name: build
on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # axion-release needs full history and tags to derive the version.
          fetch-depth: 0
          persist-credentials: false
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: 'jetbrains'
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: select mod version
        id: version
        uses: actions/github-script@v9
        with:
          script: |
            const { default: selectModVersion } = require('./.github/scripts/select-mod-version.mjs');
            await selectModVersion({ core, exec });
      - name: build
        env:
          AIRICRAFT_RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
        run: ./gradlew build
      - name: collect release jars
        env:
          MOD_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p build/release
          cp "build/libs/airicraft-$MOD_VERSION.jar" build/release/
          cp "compat/journeymap/build/libs/airicraft-journeymap-compat-$MOD_VERSION.jar" build/release/
          cp "compat/rei/build/libs/airicraft-rei-compat-$MOD_VERSION.jar" build/release/
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mod-jars
          path: build/release/*.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: download tested jars
        uses: actions/download-artifact@v8
        with:
          name: mod-jars
          path: release
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" release/*.jar \
            --verify-tag --generate-notes --title "v$RELEASE_VERSION" "${flags[@]}"
